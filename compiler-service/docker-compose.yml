version: '3.9'

# Docker Compose for local development of the compiler service.
#
# Usage:
#   docker compose up -d                   # start all services
#   docker compose logs -f compiler-worker # tail worker logs
#   docker compose down                    # stop all services
#
# Prerequisites:
#   docker build -t exam-platform/flutter-sandbox:v1 ./sandbox
#
# Workspace volume architecture:
#   The worker container is a SIBLING of the sandbox containers — both are
#   children of the Docker daemon, not parent/child. Bind-mount paths in
#   Binds[] are interpreted by the Docker daemon relative to the HOST, not
#   relative to the worker container's filesystem.
#
#   Solution: use a named Docker volume (exam-workspaces) with a fixed name.
#   The daemon manages it directly. The worker mounts it to write job files;
#   sandbox containers mount the same volume to read those files.
#   Job isolation is via per-job subdirectories (job-<uuid>/).

services:

  # ── Redis (BullMQ backend) ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Compiler API ─────────────────────────────────────────────────────────────
  # Accepts POST /run, returns jobId. Does NOT contain Flutter SDK.
  compiler-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "${COMPILER_API_PORT:-5000}:5000"
    environment:
      NODE_ENV:                      production
      COMPILER_API_PORT:             5000
      REDIS_URL:                     redis://redis:6379
      COMPILER_SERVICE_API_KEY:      ${COMPILER_SERVICE_API_KEY:-change-me-before-production}
      EXAM_ENV_VERSION:              ${EXAM_ENV_VERSION:-v1}
      MAX_EXECUTION_TIMEOUT_MS:      ${MAX_EXECUTION_TIMEOUT_MS:-120000}
      DEFAULT_EXECUTION_TIMEOUT_MS:  ${DEFAULT_EXECUTION_TIMEOUT_MS:-60000}
      MAX_RUN_REQUESTS_PER_MINUTE:   ${MAX_RUN_REQUESTS_PER_MINUTE:-10}
      MAX_FILE_COUNT:                ${MAX_FILE_COUNT:-50}
      MAX_FILE_SIZE_BYTES:           ${MAX_FILE_SIZE_BYTES:-524288}
      MAX_ASSET_SIZE_BYTES:          ${MAX_ASSET_SIZE_BYTES:-2097152}
      MAX_PROJECT_SIZE_BYTES:        ${MAX_PROJECT_SIZE_BYTES:-10485760}
      MAX_PATH_LENGTH:               ${MAX_PATH_LENGTH:-260}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Compiler Worker ───────────────────────────────────────────────────────────
  # Processes BullMQ jobs, launches Flutter sandbox containers.
  # Needs Docker socket to create/kill containers.
  # Does NOT contain Flutter SDK — that lives in the sandbox image.
  compiler-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV:                      production
      REDIS_URL:                     redis://redis:6379
      DOCKER_SANDBOX_IMAGE:          ${DOCKER_SANDBOX_IMAGE:-exam-platform/flutter-sandbox:v1}
      EXEC_CONCURRENCY:              ${EXEC_CONCURRENCY:-4}
      DEFAULT_EXECUTION_TIMEOUT_MS:  ${DEFAULT_EXECUTION_TIMEOUT_MS:-60000}
      MAX_EXECUTION_TIMEOUT_MS:      ${MAX_EXECUTION_TIMEOUT_MS:-120000}
      MAX_STDOUT_BYTES:              ${MAX_STDOUT_BYTES:-2097152}
      MAX_STDERR_BYTES:              ${MAX_STDERR_BYTES:-2097152}
      SANDBOX_MEMORY_MB:             ${SANDBOX_MEMORY_MB:-1024}
      SANDBOX_NANO_CPUS:             ${SANDBOX_NANO_CPUS:-1000000000}
      SANDBOX_PIDS:                  ${SANDBOX_PIDS:-256}
      SANDBOX_TMPFS_MB:              ${SANDBOX_TMPFS_MB:-128}
      # Experiment-only CPU override. Empty string = unset in production.
      # Set SANDBOX_CPU_EXPERIMENT=<NanoCpus> in the shell before force-recreating
      # the worker to test a specific CPU limit without touching .env.
      # NEVER leave this set in production.
      SANDBOX_CPU_EXPERIMENT:        ${SANDBOX_CPU_EXPERIMENT:-}
      EXAM_ENV_VERSION:              ${EXAM_ENV_VERSION:-v1}
      # Name of the Docker named volume used to share job workspaces between
      # the worker and sandbox containers. Must match the volume name below.
      WORKSPACE_VOLUME_NAME:         exam-workspaces
    volumes:
      # Docker socket: needed to spawn and kill sandbox containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace volume: worker writes job files here; sandbox containers read them.
      # Both use the same named volume so the Docker daemon can resolve the path.
      - exam-workspaces:/exam-workspaces
    depends_on:
      redis:
        condition: service_healthy

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  exam-workspaces:
    # Fixed name — NOT prefixed with the compose project name.
    # This must match WORKSPACE_VOLUME_NAME in the worker environment above.
    name: exam-workspaces
